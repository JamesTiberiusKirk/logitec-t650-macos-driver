name: ci
on: [push, pull_request]
jobs:
  linux-core:
    runs-on: ubuntu-latest
    container: swift:latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  macos-daemon:
    runs-on: macos-15   # arm64
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release
      - run: swift test
      - uses: actions/upload-artifact@v4
        with:
          name: t650d
          path: .build/release/t650d
